<!DOCTYPE html>
<html>
  <head>
    <title>Contact Me - Get in Touch</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <nav class="navbar">
        <div class="nav-brand">My Portfolio</div>
        <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>

        <ul class="nav-links" id="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <main class="card-container">
      <div class="faith-card" style="width: 350px;">
        <h1>Get in Touch</h1>
        <p>Have a question or want to connect? Drop a message below.</p>

        <form id="contact-form" class="contact-form">
          <input id="name-input" class="contact-form-input" type="text" placeholder="Your Name" required>
          
          <input id="email-input" class="contact-form-input" type="email" placeholder="Your Email" required>
          
          <textarea id="message-input" class="contact-form-textarea" placeholder="Your Message" rows="4" required></textarea>
          
          <button  type="submit" class="amen-btn">Send Message</button>
        </form>

        <p id="success-message" style="display: none; color: var(--accent-color); font-weight: 500; text-align: center; margin-top: 10px;"></p>

      </div>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 My Portfolio Website. Built with Faith & Code.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
