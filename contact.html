<!DOCTYPE html>
<html>
  <head>
    <title>Contact Me - Get in Touch</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <nav class="navbar">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>

    <main class="card-container">
      <div class="faith-card" style="width: 350px;">
        <h1>Get in Touch</h1>
        <p>Have a question or want to connect? Drop a message below.</p>

        <form id="contact-form">
          <input class="contact-form-input" type="text" placeholder="Your Name" required>
          
          <input class="contact-form-input" type="email" placeholder="Your Email" required>
          
          <textarea class="contact-form-textarea" placeholder="Your Message" rows="4" required></textarea>
          
          <button  type="submit" class="amen-btn">Send Message</button>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 My Portfolio Website. Built with Faith & Code.</p>
    </footer>

  </body>
</html>
