<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!DOCTYPE html>
<html>
  <head>
    <title>My Faith Card</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
      body {
        background-color: #0f172a;
        color: #f8fafc;
        font-family: 'Rubik', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .faith-card {
        background-color: #1e293b;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        max-width: 450px;
        text-align: center;
        border: 1px solid #334155;

        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
      }

      h1 {
        color: #38bdf8;
        margin: 0;
        font-weight: 700;
      }

      p {
        font-size: 1.15rem;
        line-height: 1.6;
        color: #cbd5e1;
        margin: 0;
      }

      .amen-btn {
        background-color: #38bdf8;
        color: #0f172a;
        border: none;
        padding: 12px 28px;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s ease;
        font-family: 'Rubik', sans-serif;
      }

      .amen-btn:hover {
        background-color: #0ea5e9;
      }
    </style>
  </head>
  <body>

    <div class="faith-card">
      <h1>My Declaration</h1>
      <p>I am a believer. I am resilient. I am a soldier in the army of Jesus Christ, my commander.</p>
      <button class="amen-btn">Amen!</button>
    </div>

  </body>
</html>
</body>
</html>
